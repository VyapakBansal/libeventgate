# Phase 0 locked decisions. C++ runtime uses CLI + compile-time defaults in
# include/libeventgate/config.hpp — keep those in sync when you edit this.

sensor:
  name: IMX637
  width: 640
  height: 512
  crop_at_capture: false

firenet:
  repo: https://github.com/cedric-scheerlinck/rpg_e2vid
  branch: cedric/firenet
  checkpoint: firenet_1000.pth.tar
  # Google Drive (official README): https://drive.google.com/file/d/1nBCeIF_Us-rGhCjdU5q1Ch-yrFckjZPa
  checkpoint_gdrive_id: 1nBCeIF_Us-rGhCjdU5q1Ch-yrFckjZPa
  variant: plain   # not FireNet+
  # Paper defaults (also embedded in checkpoint config):
  #   num_bins: 5, base_num_channels: 16, recurrent_block_type: convgru
  #   recurrent_blocks: {resblock: [0]} → 2 externalized states (head + R0)
  export:
    onnx: engines/firenet.onnx
    externalize_state: true   # h_in_*/h_out_* required for IMU gate freeze
    height: 512
    width: 640
    opset: 17

event_interchange:
  capture_format: prophesee_raw   # OpenEB / Studio on capture laptop
  processing_format: hdf5         # ACTIVE for phase0_run (--events)
  # events/x,y,t_us,p ; attrs: height, width, sensor
  # MCAP: partial scaffold only (include/libeventgate/mcap_io.hpp + src/mcap_io.cpp).
  # Not in CMake / CLI yet — finish later. Build path is HDF5 + IMU CSV.

imu:
  packaging: sidecar_csv
  columns: [timestamp_us, gyro_x, gyro_y, gyro_z, accel_x, accel_y, accel_z]

voxel:
  bins: 5
  window_ms: 10
  dtype: float16   # preferred when TRT engine voxel binding is half

gating:
  mode: hard
  imu_only: true
  gyro_norm_threshold_rad_s: 0.08  # this bag; re-estimate on a new IMU
  hold_lookback_s: 1.0             # FireNet fade horizon, not a visual fudge
  hold_release_s: 0.25             # ignore brief MOVING flicker
  # freeze_state requires engine with state I/O (export --externalize-state)

tensorrt:
  major: 10
  prefer_precision: fp16   # INT8 after calibrator exists; --int8 flags intent only for now
  max_workspace_mb: 512
  engine: engines/firenet.engine
  # Build: ./build/build_engine --onnx engines/firenet.onnx --engine engines/firenet.engine \
  #          --workspace-mb 512 --fp16 --no-int8

vram:
  gpu_total_mb: 6141
  warn_over_mb: 4500
  # FireNet FP16 at 640x512: bindings ≪ 1 GiB; builder peak is the tighter constraint

demo:
  keypoint_detector: ORB
  outputs: [keypoints.csv, recon.mp4]
  blackout_tail_s: 2   # empty windows after last event for easy-stop pitch clip
  # phase0_run --events ... --engine engines/firenet.engine --out out/before \
  #   --blackout-tail-s 2

language:
  runtime: cpp_cuda_tensorrt
  python_only: firenet_torch_to_onnx_export
