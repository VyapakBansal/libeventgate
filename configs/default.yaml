# Defaults for this sensor. The C++ CLI does not read this file; keep it
# aligned with include/libeventgate/config.hpp.

sensor:
  name: IMX637
  width: 640
  height: 512

firenet:
  repo: https://github.com/cedric-scheerlinck/rpg_e2vid
  branch: cedric/firenet
  checkpoint: firenet_1000.pth.tar
  checkpoint_gdrive_id: 1nBCeIF_Us-rGhCjdU5q1Ch-yrFckjZPa
  export:
    onnx: engines/firenet.onnx
    externalize_state: true  # h_in_*/h_out_* required for the IMU gate
    height: 512
    width: 640
    opset: 17

event_interchange:
  processing_format: hdf5  # /events/{x,y,t_us,p}

imu:
  packaging: sidecar_csv
  columns: [timestamp_us, gyro_x, gyro_y, gyro_z, accel_x, accel_y, accel_z]

voxel:
  bins: 5
  window_ms: 10
  dtype: float16

gating:
  mode: hard
  gyro_norm_threshold_rad_s: 0.08  # re-estimate on a new IMU
  hold_lookback_s: 1.0
  hold_min_static_s: 1.0
  hold_release_s: 0.25

tensorrt:
  major: 10
  prefer_precision: fp16
  max_workspace_mb: 512
  engine: engines/firenet.engine

output:
  keypoint_detector: ORB
  files: [keypoints.csv, recon.mp4]
  blackout_tail_s: 2
